name: mocca-production

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-role:
    image: postgres:18
    profiles:
      - setup
    entrypoint: ["/bin/sh", "/usr/local/bin/create-runtime-role.sh"]
    command: []
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      MOCCA_APP_PASSWORD: ${MOCCA_APP_PASSWORD:?Set MOCCA_APP_PASSWORD in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ops/create-runtime-role.sh:/usr/local/bin/create-runtime-role.sh:ro
    networks:
      - backend

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:?Set SEAWEEDFS_ACCESS_KEY_ID in .env.production}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:?Set SEAWEEDFS_SECRET_ACCESS_KEY in .env.production}
      S3_BUCKET: mocca-photos
    volumes:
      - seaweedfs-data:/data
    networks:
      - backend

  migrate:
    profiles:
      - migrations
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: workspace
    command: ["pnpm", "--filter", "@mocca/db", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-mocca}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    image: ${MOCCA_API_IMAGE:-mocca-api:local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-mocca://}
      DATABASE_URL: postgresql://mocca_app:${MOCCA_APP_PASSWORD:?Set MOCCA_APP_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-mocca}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env.production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env.production}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env.production}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:?Set APPLE_CLIENT_ID in .env.production}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in .env.production}
      APPLE_KEY_ID: ${APPLE_KEY_ID:?Set APPLE_KEY_ID in .env.production}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:?Set APPLE_PRIVATE_KEY in .env.production}
      APPLE_APP_BUNDLE_IDENTIFIER: ${APPLE_APP_BUNDLE_IDENTIFIER:?Set APPLE_APP_BUNDLE_IDENTIFIER in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - edge
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
