name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, linting, types, and tests
        run: pnpm check

      - name: Build server
        run: pnpm --filter @mocca/server build

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Build production API image
        run: docker build --file apps/server/Dockerfile --target runtime --tag mocca-api:ci .
