name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, linting, types, and tests
        run: pnpm check

      - name: Build server
        run: pnpm --filter @mocca/server build

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Build production API image
        run: docker build --file apps/server/Dockerfile --target runtime --tag mocca-api:ci .

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH credentials
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.PRODUCTION_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid or missing production host" >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid or missing production user" >&2; exit 1; }
          [[ -n "$DEPLOY_PRIVATE_KEY" ]] || { echo "Missing production SSH private key secret" >&2; exit 1; }
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo "Missing pinned SSH known_hosts variable" >&2; exit 1; }

          install -d -m 0700 "$RUNNER_TEMP/mocca-ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$RUNNER_TEMP/mocca-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/mocca-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/mocca-ssh/id_ed25519" "$RUNNER_TEMP/mocca-ssh/known_hosts"
          unset DEPLOY_PRIVATE_KEY

          ssh-keygen -F "$DEPLOY_HOST" -f "$RUNNER_TEMP/mocca-ssh/known_hosts" >/dev/null || {
            echo "Pinned host key does not contain the configured production host" >&2
            exit 1
          }

      - name: Pull, build, and start production stack
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$RUNNER_TEMP/mocca-ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/mocca-ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/sebastian/mocca
          git pull --ff-only origin main

          compose=(docker compose --env-file .env.production -f compose.production.yaml)
          "${compose[@]}" build api
          "${compose[@]}" run --rm --no-deps --entrypoint sh api -ec '
            node dist/server.js &
            api_pid=$!
            trap "kill \"$api_pid\" 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if ! kill -0 "$api_pid" 2>/dev/null; then
                exit 1
              fi
              if node -e "fetch(\"http://127.0.0.1:3000/health\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                exit 0
              fi
              sleep 1
            done
            exit 1
          '
          "${compose[@]}" up --detach --remove-orphans --wait --wait-timeout 180
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 10 --retry-connrefused --retry-delay 2 \
            https://mocca-api.sebastianamartinez.com/health
          REMOTE
